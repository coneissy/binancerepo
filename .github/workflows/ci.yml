name: Binance Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_BASE_URL: https://demo-fapi.binance.com
      DRY_RUN: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: pytest -q

      - name: Check required bot secrets are not committed
        shell: bash
        run: |
          if grep -RniE '(^|[^A-Za-z])(BINANCE_API_KEY|BINANCE_API_SECRET|TELEGRAM_BOT_TOKEN)[[:space:]]*=[[:space:]]*["'"'][^$]' . \
            --exclude-dir=.git --exclude='*.md' --exclude='ci.yml' --exclude='.env.example'; then
            echo 'Possible hard-coded secret detected. Use GitHub Actions secrets/environment variables.'
            exit 1
          fi
