name: Binance Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_BASE_URL: https://demo-fapi.binance.com
      DRY_RUN: true
      LIVE_TRADING: false
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q .

      - name: Import every top-level Python module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          from pathlib import Path
          failures = []
          for path in sorted(Path('.').glob('*.py')):
              name = path.stem
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append(f'{name}: {type(exc).__name__}: {exc}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('All top-level Python modules imported successfully.')
          PY

      - name: Run unit tests
        run: pytest -q

      - name: Check required bot secrets are not committed
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE '(^|[^A-Za-z_])(BINANCE_API_KEY|BINANCE_API_SECRET|TELEGRAM_BOT_TOKEN)[[:space:]]*=[[:space:]]*["'"'][^"'"'[:space:]]+["'"']' -- \
            ':!*.md' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo 'Possible hard-coded secret detected. Use GitHub Actions secrets/environment variables.'
            exit 1
          fi
