name: Binance Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_BASE_URL: https://demo-fapi.binance.com
      DRY_RUN: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: pytest -q

      - name: Check required bot secrets are not committed
        shell: bash
        run: |
          set -euo pipefail
          # Scan tracked files only. Ignore documentation, CI itself, and the
          # intentionally-placeholder .env.example. Match quoted literal values
          # only; os.getenv()/getenv() references are not secrets.
          if git grep -nIE '(^|[^A-Za-z_])(BINANCE_API_KEY|BINANCE_API_SECRET|TELEGRAM_BOT_TOKEN)[[:space:]]*=[[:space:]]*["'"'][^"'"'[:space:]]+["'"']' -- \
            ':!*.md' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo 'Possible hard-coded secret detected. Use GitHub Actions secrets/environment variables.'
            exit 1
          fi
