name: Binance Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Validate Python files
        shell: bash
        run: |
          python_files=$(find . -type f -name '*.py' -not -path './.git/*')
          if [ -z "$python_files" ]; then
            echo 'No Python files found yet; repository structure is valid.'
            exit 0
          fi
          python -m compileall -q .

      - name: Check required bot secrets are not committed
        shell: bash
        run: |
          if grep -RniE '(^|[^A-Za-z])(BINANCE_API_KEY|BINANCE_API_SECRET|TELEGRAM_BOT_TOKEN)[[:space:]]*=[[:space:]]*["'"'][^$]' . \
            --exclude-dir=.git --exclude='*.md' --exclude='ci.yml'; then
            echo 'Possible hard-coded secret detected. Use GitHub Actions secrets/environment variables.'
            exit 1
          fi
