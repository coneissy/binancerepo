services:
  - type: web
    name: binance-futures-scalper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://demo-fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binance.com/ws
      - key: BINANCE_SYMBOL
        value: BTCUSDT
      - key: BINANCE_INTERVAL
        value: 1m
      - key: BINANCE_LEVERAGE
        value: "3"
      - key: RISK_PER_TRADE
        value: "0.0025"
      - key: MAX_DAILY_LOSS
        value: "0.01"
      - key: MAX_TRADES_PER_DAY
        value: "10"
      - key: COOLDOWN_SECONDS
        value: "300"
      - key: LOOP_SECONDS
        value: "30"
      - key: DRY_RUN
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RISK_STATE_FILE
        value: risk_state.json
