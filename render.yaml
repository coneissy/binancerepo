services:
  - type: web
    name: binance-1m-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binance.com/stream
      - key: DISCOVERY_N
        value: "75"
      - key: EXECUTION_N
        value: "15"
      - key: RANK_REFRESH_SECONDS
        value: "10"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "15"
      - key: ENTRY_SCORE
        value: "0.42"
      - key: MIN_24H_QUOTE_VOLUME
        value: "200000"
      - key: MIN_3M_QUOTE_VOLUME
        value: "3000"
      - key: MAX_SPREAD_BPS
        value: "35"
      - key: WARMUP_BARS
        value: "24"
      - key: MAX_HOLD_SECONDS
        value: "600"
      - key: EST_FEE_BPS
        value: "4"
      - key: EST_SLIPPAGE_BPS
        value: "3"
      - key: BASE_RISK_PCT
        value: "0.005"
      - key: ARB_RISK_PCT
        value: "0.01"
      - key: SL_PCT
        value: "0.01"
      - key: TP_PCT
        value: "0.02"
      - key: TRAIL_ACTIVATION_PCT
        value: "0.003"
      - key: TRAIL_NORMAL_PCT
        value: "0.004"
      - key: TRAIL_RISING_PCT
        value: "0.0035"
      - key: TRAIL_HIGH_PCT
        value: "0.0025"
      - key: TRAIL_ALERT_PCT
        value: "0.002"
      - key: SIM_START_EQUITY
        value: "10000"
      - key: MAX_DRAWDOWN_PCT
        value: "0.08"
      - key: DRY_RUN
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
