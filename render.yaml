services:
  - type: web
    name: binance-futures-scalper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m multi_coin_scalper
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://demo-fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binance.com/ws
      - key: SCAN_SIZE
        value: "100"
      - key: SCAN_SECONDS
        value: "5"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "3"
      - key: MIN_24H_QUOTE_VOLUME
        value: "5000000"
      - key: MIN_ATR_PCT
        value: "0.0015"
      - key: MAX_ATR_PCT
        value: "0.08"
      - key: MIN_SIGNAL_SCORE
        value: "0.80"
      - key: TP_ATR
        value: "0.65"
      - key: SL_ATR
        value: "1.00"
      - key: DRY_RUN
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
