services:
  - type: web
    name: binance-1m-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://demo-fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binance.com/stream
      - key: DISCOVERY_N
        value: "50"
      - key: EXECUTION_N
        value: "10"
      - key: RANK_REFRESH_SECONDS
        value: "30"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "10"
      - key: ENTRY_SCORE
        value: "0.60"
      - key: MIN_EDGE_BPS
        value: "9"
      - key: MIN_24H_QUOTE_VOLUME
        value: "300000"
      - key: MIN_1M_QUOTE_VOLUME
        value: "4500"
      - key: MIN_FLOW_SCORE
        value: "0.47"
      - key: TOP_GAINERS_N
        value: "20"
      - key: TREND_SOFT_MOM
        value: "0.004"
      - key: TREND_SOFT_FLOW
        value: "0.15"
      - key: MAX_SPREAD_BPS
        value: "15"
      - key: WARMUP_BARS
        value: "25"
      - key: MAX_HOLD_SECONDS
        value: "300"
      - key: EST_FEE_BPS
        value: "4"
      - key: EST_SLIPPAGE_BPS
        value: "3"
      - key: BASE_RISK_PCT
        value: "0.002"
      - key: SIM_START_EQUITY
        value: "10000"
      - key: MAX_DRAWDOWN_PCT
        value: "0.08"
      - key: DRY_RUN
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
