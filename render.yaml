services:
  - type: web
    name: binance-ultra-plus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://demo-fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binance.com/stream
      - key: TOP_N
        value: "20"
      - key: CHALLENGER_N
        value: "10"
      - key: RANK_REFRESH_SECONDS
        value: "30"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "3"
      - key: ENTRY_SCORE
        value: "0.78"
      - key: CHALLENGER_GAP
        value: "0.06"
      - key: MIN_24H_QUOTE_VOLUME
        value: "1000000"
      - key: MIN_1M_QUOTE_VOLUME
        value: "50000"
      - key: MAX_SPREAD_BPS
        value: "10"
      - key: ENTRY_COOLDOWN_SECONDS
        value: "45"
      - key: MAX_HOLD_SECONDS
        value: "180"
      - key: EST_FEE_BPS
        value: "4"
      - key: EST_SLIPPAGE_BPS
        value: "3"
      - key: DRY_RUN
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
