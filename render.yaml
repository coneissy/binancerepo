services:
  - type: web
    name: binance-arbitrage-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://api.binance.com
      - key: BINANCE_API_BASE
        value: https://api.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://stream.binance.com:9443
      - key: ARB_WS_SHARD_SIZE
        value: "40"
      - key: ARB_MIN_NET_BPS
        value: "3"
      - key: ARB_FEE_BPS
        value: "4"
      - key: ARB_SLIPPAGE_BPS
        value: "1.5"
      - key: ARB_STALE_MS
        value: "750"
      - key: ARB_SCAN_INTERVAL
        value: "0.05"
      - key: ARB_RISK_PCT
        value: "0.01"
      - key: LIVE_STARTING_BALANCE_USDT
        value: "30"
      - key: MAX_LIVE_NOTIONAL_USDT
        value: "0.30"
      - key: LIVE_ORDER_COOLDOWN_MS
        value: "5000"
      - key: LIVE_TRADING
        value: "false"
      - key: SIM_START_EQUITY
        value: "30"
      - key: LOG_LEVEL
        value: "INFO"
