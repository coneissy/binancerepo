services:
  - type: web
    name: binance-futures-scalper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://demo-fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binancefuture.com/stream
      - key: UNIVERSE_SIZE
        value: "100"
      - key: WS_SHARDS
        value: "5"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "3"
      - key: MIN_24H_QUOTE_VOLUME
        value: "5000000"
      - key: ENTRY_SCORE
        value: "0.45"
      - key: TAKE_PROFIT_PCT
        value: "0.0015"
      - key: STOP_LOSS_PCT
        value: "0.0010"
      - key: MAX_HOLD_SECONDS
        value: "15"
      - key: MAX_SPREAD_BPS
        value: "12"
      - key: ENTRY_COOLDOWN_SECONDS
        value: "0.50"
      - key: DRY_RUN
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
