services:
  - type: web
    name: binance-1m-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_runner.py
    healthCheckPath: /healthz
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_BASE_URL
        value: https://fapi.binance.com
      - key: BINANCE_WS_BASE_URL
        value: wss://fstream.binance.com/stream
      - key: DISCOVERY_N
        value: "50"
      - key: EXECUTION_N
        value: "10"
      - key: RANK_REFRESH_SECONDS
        value: "30"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "8"
      - key: ENTRY_SCORE
        value: "0.64"
      - key: MIN_24H_QUOTE_VOLUME
        value: "500000"
      - key: MIN_3M_QUOTE_VOLUME
        value: "12000"
      - key: MAX_SPREAD_BPS
        value: "18"
      - key: WARMUP_BARS
        value: "40"
      - key: MAX_HOLD_SECONDS
        value: "900"
      - key: EST_FEE_BPS
        value: "4"
      - key: EST_SLIPPAGE_BPS
        value: "3"
      - key: BASE_RISK_PCT
        value: "0.0025"
      - key: SL_PCT
        value: "0.01"
      - key: TP_PCT
        value: "0.02"
      - key: SIM_START_EQUITY
        value: "10000"
      - key: MAX_DRAWDOWN_PCT
        value: "0.08"
      - key: BUILDIX_BASE_URL
        value: https://www.buildix.trade/api/v1
      - key: BUILDIX_API_KEY
        sync: false
      - key: BUILDIX_REFRESH_SECONDS
        value: "60"
      - key: BUILDIX_MAX_AGE_SECONDS
        value: "180"
      - key: BUILDIX_SIGNAL_WEIGHT
        value: "0.12"
      - key: BUILDIX_SMART_WEIGHT
        value: "0.10"
      - key: BUILDIX_MIN_SMART_COVERAGE
        value: "5"
      - key: BUILDIX_MIN_SIGNAL_SCORE
        value: "20"
      - key: DRY_RUN
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
